<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="320" viewBox="0 0 1000 320" role="img" aria-label="Financial Statement Translator — 财务报表中英翻译器">
  <title>Financial Statement Translator — 财务报表中英翻译器</title>

  <!-- 纸面：暖白，横向账簿格线 -->
  <rect width="1000" height="320" fill="#F7F3EB"/>
  <g stroke="#EDE6D6" stroke-width="1">
    <line x1="0" y1="40"  x2="1000" y2="40"/>
    <line x1="0" y1="80"  x2="1000" y2="80"/>
    <line x1="0" y1="120" x2="1000" y2="120"/>
    <line x1="0" y1="160" x2="1000" y2="160"/>
    <line x1="0" y1="200" x2="1000" y2="200"/>
    <line x1="0" y1="240" x2="1000" y2="240"/>
    <line x1="0" y1="280" x2="1000" y2="280"/>
  </g>

  <!-- 账簿红边线：把叙述与数字分开 -->
  <line x1="48"  y1="30" x2="48"  y2="292" stroke="#A62B1F" stroke-width="1.4" opacity="0.55"/>
  <line x1="648" y1="30" x2="648" y2="292" stroke="#A62B1F" stroke-width="1.4" opacity="0.55"/>

  <!-- 左：报表抬头式标题 -->
  <g font-family="Georgia, 'Times New Roman', 'Songti SC', serif" fill="#17150F">
    <text x="70" y="104" font-size="44" letter-spacing="-0.4">FINANCIAL STATEMENT</text>
    <text x="70" y="150" font-size="44" letter-spacing="5">TRANSLATOR</text>
  </g>
  <text x="72" y="198" font-family="'Noto Serif CJK SC', 'Songti SC', 'SimSun', Georgia, serif"
        font-size="28" fill="#17150F" letter-spacing="3">财务报表中英翻译器</text>
  <text x="73" y="234" font-family="'Microsoft YaHei', 'PingFang SC', 'Noto Sans CJK SC', sans-serif"
        font-size="13.5" fill="#5C5647">术语锁定 · 数字校验 · 逐行对齐，英文财报读成中文不丢一个数</text>

  <!-- 右：一张会平的迷你报表（629 + 179 − 58 = 750） -->
  <line x1="664" y1="64" x2="952" y2="64" stroke="#17150F" stroke-width="1"/>
  <g font-family="'Microsoft YaHei', 'PingFang SC', 'Noto Sans CJK SC', sans-serif" font-size="11.5" fill="#5C5647">
    <text x="664" y="84" letter-spacing="1">TERM 项目</text>
    <text x="952" y="84" text-anchor="end" letter-spacing="1">COUNT 数量</text>
  </g>

  <g font-family="'Microsoft YaHei', 'PingFang SC', 'Noto Sans CJK SC', sans-serif" font-size="15" fill="#17150F">
    <text x="664" y="118">教材术语　TEXTBOOK TERMS</text>
    <text x="664" y="152">报表行项目　STATEMENT ITEMS</text>
    <text x="664" y="186">重复项合并　DUPLICATES</text>
  </g>
  <g font-family="Consolas, 'SF Mono', 'DejaVu Sans Mono', monospace" font-size="17" fill="#17150F" text-anchor="end">
    <text x="952" y="118">629</text>
    <text x="952" y="152">179</text>
    <text x="952" y="186">(58)</text>
  </g>

  <!-- 小计单线，合计双线 -->
  <line x1="664" y1="202" x2="952" y2="202" stroke="#17150F" stroke-width="1.2"/>
  <text x="664" y="232" font-family="'Microsoft YaHei', 'PingFang SC', 'Noto Sans CJK SC', sans-serif"
        font-size="15" font-weight="700" fill="#17150F">术语合计　TOTAL TERMS</text>
  <text x="952" y="236" text-anchor="end" font-family="Consolas, 'SF Mono', 'DejaVu Sans Mono', monospace"
        font-size="25" font-weight="700" fill="#A62B1F">750</text>
  <line x1="664" y1="250" x2="952" y2="250" stroke="#17150F" stroke-width="1.2"/>
  <line x1="664" y1="255" x2="952" y2="255" stroke="#17150F" stroke-width="1.2"/>

  <!-- 页脚 -->
  <text x="70" y="292" font-family="Consolas, 'SF Mono', 'DejaVu Sans Mono', monospace"
        font-size="11.5" fill="#5C5647" letter-spacing="0.8">EN → ZH ／ MIT ／ GitHub Actions 自动构建</text>
</svg>
